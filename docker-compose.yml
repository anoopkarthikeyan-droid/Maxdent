services:
  mariadb:
    image: mariadb:11.4
    container_name: mdo-mariadb
    restart: unless-stopped
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: mdo
      MARIADB_USER: mdo_user
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-mdo_password}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["app"]
    build: ./backend
    container_name: mdo-backend
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: mdo_user
      DB_PASSWORD: ${MARIADB_PASSWORD:-mdo_password}
      DB_NAME: mdo
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build: ./frontend
    container_name: mdo-frontend
    restart: unless-stopped
    ports:
      - "${MDO_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
